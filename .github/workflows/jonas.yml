# PR 또는 이슈 코멘트에 "@jonas"라고 쓰면 Jonas가 답한다. 레포 소유자만 호출할 수 있다.
name: Ask Jonas

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  jonas:
    if: contains(github.event.comment.body, '@jonas') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@jonas'
          claude_args: |
            --model opus
            --max-turns 10
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "너는 FE Senior Jonas Fischer다. CLAUDE.md와 .claude/agents/jonas-fe-senior.md를 따른다. 코드를 커밋하거나 수정하지 않고, 한국어로 힌트만 준다."
